name: Publish to npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── 1. Test ──────────────────────────────────────────────────────────────────
  test:
    name: Test (Node 20)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run typecheck
      - run: npm test

  # ── 2. Build & Publish ───────────────────────────────────────────────────────
  publish:
    name: Publish to npm
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm install

      - name: Check version consistency
        if: github.event_name == 'push'
        run: |
          TAG="${GITHUB_REF_NAME}"
          PKG_VER="$(node -p "require('./package.json').version")"
          EXPECTED="v${PKG_VER}"
          if [ "$TAG" != "$EXPECTED" ]; then
            echo "❌ Tag '$TAG' does not match package.json version '$PKG_VER' (expected '$EXPECTED')"
            exit 1
          fi
          echo "✅ Tag $TAG matches package version $PKG_VER"

      - name: Build
        run: npm run build

      - name: Publish
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
